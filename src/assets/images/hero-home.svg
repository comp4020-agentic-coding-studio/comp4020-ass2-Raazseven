<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title">
  <title id="hero-title">A record track running unbroken while a capability track stops, then resumes at a visible cost</title>
  <rect width="1600" height="900" fill="#f3ede1" />

  <!-- time axis -->
  <line x1="180" y1="620" x2="1420" y2="620" stroke="#6b6154" stroke-width="2" opacity="0.55" />
  <g stroke="#6b6154" stroke-width="2" opacity="0.4">
    <line x1="180" y1="613" x2="180" y2="627" />
    <line x1="490" y1="613" x2="490" y2="627" />
    <line x1="800" y1="613" x2="800" y2="627" />
    <line x1="1110" y1="613" x2="1110" y2="627" />
    <line x1="1420" y1="613" x2="1420" y2="627" />
  </g>

  <!-- record track: continues, unbroken -->
  <line x1="180" y1="360" x2="1420" y2="360" stroke="#6b6154" stroke-width="6" />

  <!-- capability track: stops, then resumes heavier (at cost) -->
  <line x1="180" y1="470" x2="760" y2="470" stroke="#b97d1c" stroke-width="9" stroke-linecap="round" />
  <circle cx="760" cy="470" r="16" fill="#b97d1c" />
  <line x1="1010" y1="470" x2="1420" y2="470" stroke="#8a5c13" stroke-width="16" stroke-linecap="round" />
  <circle cx="1010" cy="470" r="16" fill="none" stroke="#8a5c13" stroke-width="7" />
</svg>
